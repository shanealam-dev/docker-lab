services:
  frontend:
    build:
      context: ../02-dockerfiles-multistage/react-app
      dockerfile: Dockerfile
    image: hero-react:prod
    container_name: prod-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - frontend-net
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  api:
    build:
      context: ../02-dockerfiles-multistage/node-app
      dockerfile: Dockerfile
    image: hero-node:1.0
    container_name: prod-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - DB_HOST=postgres
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - REDIS_HOST=redis
    networks:
      - frontend-net
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  python-worker:
    build:
      context: ../02-dockerfiles-multistage/python-app
      dockerfile: Dockerfile
    image: hero-python:1.0
    container_name: prod-worker
    restart: unless-stopped
    ports:
      - "5500:5500"
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - REDIS_HOST=redis
    networks:
      - backend-net
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: prod-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - backend-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 2s

  postgres:
    image: postgres:16-alpine
    container_name: prod-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - prod_pg_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 3s

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  prod_pg_data:
